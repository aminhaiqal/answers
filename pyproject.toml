[project]
name = "axelyn-answers"
version = "0.1.0"
description = "Private, source-grounded document question answering"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "rank-bm25>=0.2.2,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/axelyn"]
